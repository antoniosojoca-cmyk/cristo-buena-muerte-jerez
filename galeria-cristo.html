
<!DOCTYPE html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cristo de la Buena Muerte — Galería</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #ffffff;
  font-family: Georgia, "Times New Roman", serif;
}

/* CABECERA */

header {
  text-align: center;
  padding: 55px 20px 35px;
  border-bottom: 1px solid #c9a35b;
}

header h1 {
  margin: 0;
  color: #c9a35b;
  font-size: 42px;
  font-weight: normal;
  letter-spacing: 2px;
}

header p {
  color: #dddddd;
  font-size: 18px;
  margin-top: 12px;
}

/* MENU */

.menu {
  text-align: center;
  padding: 22px 10px;
  border-bottom: 1px solid #333333;
}

.menu a {
  color: #c9a35b;
  text-decoration: none;
  margin: 0 14px;
  font-size: 17px;
  transition: .3s;
}

.menu a:hover {
  color: #ffffff;
}

/* TITULO */

.titulo {
  text-align: center;
  padding: 45px 20px 25px;
}

.titulo h2 {
  color: #c9a35b;
  font-size: 34px;
  font-weight: normal;
  margin: 0 0 12px;
  letter-spacing: 1px;
}

.titulo p {
  color: #cccccc;
  font-size: 17px;
  margin: 0;
}

/* GALERIA */

.galeria {
  width: 92%;
  max-width: 1200px;
  margin: 30px auto 70px;
}

/* FOTOGRAFIAS */

.galeria img {
  width: 100%;
  height: 720px;
  object-fit: cover;
  object-position: center;
  display: block;
  margin: 0 auto 40px;
  background: #050505;
  border: 2px solid #c9a35b;
  padding: 0;
  transition: .3s;
}

.galeria img:hover {
  transform: scale(1.01);
}

/* CREDITOS */

.creditos {
  text-align: center;
  color: #777777;
  font-size: 12px;
  margin: 20px auto 45px;
  width: 90%;
}

/* PIE */

footer {
  text-align: center;
  padding: 30px;
  border-top: 1px solid #333333;
  color: #888888;
  font-size: 13px;
}

/* BOTON MUSICA */

.musica {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #c9a35b;
  color: #080808;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 23px;
  cursor: pointer;
  z-index: 1000;
  box-shadow: 0 0 15px rgba(201,163,91,0.45);
  transition: .3s;
}

.musica:hover {
  transform: scale(1.08);
}

/* YOUTUBE OCULTO */

.youtube {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
}

.youtube iframe {
  width: 1px;
  height: 1px;
  border: 0;
}

/* MOVIL */

@media(max-width:800px) {

  header h1 {
    font-size: 32px;
  }

  .titulo h2 {
    font-size: 28px;
  }

  .galeria {
    width: 95%;
  }

  .galeria img {
    height: 600px;
  }

  .menu a {
    display: inline-block;
    margin: 7px 8px;
  }

}

</style>

</head>
