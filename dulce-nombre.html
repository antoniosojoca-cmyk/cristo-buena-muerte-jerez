body {

}

header {
  text-align: center;

.menu a:hover {
  color: white;

.salas {
  width: 94%;
  max-width: 1500px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 35px;
  padding-bottom: 60px;
}

.sala {
  background: #050505;
  border: 1px solid #c9a35b;
  padding: 8px;
  text-align: center;
}

.sala h2 {
  color: #c9a35b;
  font-size: 25px;
  font-weight: normal;
  margin: 18px 10px;
}

.sala img {
  width: 100%;
  height: 460px;
  object-fit: contain;
  display: block;
  background: #000000;
}

.sala a {
  text-decoration: none;
}

footer {
  text-align: center;
  padding: 30px;
  border-top: 1px solid #333;
  color: #888;
}

/* MUSICA */

.musica {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 100;
}

.musica button {
  background: rgba(0,0,0,0.72);
  border: 1px solid #c9a35b;
  color: #c9a35b;
  padding: 10px 16px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 14px;
  cursor: pointer;
  border-radius: 2px;
}

.musica button:hover {
  background: #c9a35b;
  color: #080808;
}

.youtube {
  position: fixed;
  width: 1px;
  height: 1px;
  left: -100px;
  top: -100px;
  opacity: 0;
  pointer-events: none;
}

@media (max-width: 800px) {

  .salas {
    grid-template-columns: 1fr;
  }

  header h1 {
    font-size: 32px;
  }

  .sala img {
    height: 400px;
  }

  .menu a {
    display: inline-block;
    margin: 6px 8px;
  }

}
