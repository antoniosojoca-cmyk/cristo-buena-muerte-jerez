

<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>La Madrugá</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #ffffff;
      font-family: Georgia, "Times New Roman", serif;
    }

    header {
      text-align: center;
      padding: 55px 20px 35px;
    }

    h1 {
      margin: 0;
      color: #c9a35b;
      font-size: 42px;
      font-weight: normal;
      letter-spacing: 2px;
    }

    .subtitulo {
      margin-top: 12px;
      color: #bdbdbd;
      font-size: 18px;
    }

    nav {
      text-align: center;
      padding: 15px 10px 35px;
    }

    nav a {
      color: #c9a35b;
      text-decoration: none;
      margin: 0 12px;
      font-size: 17px;
    }

    nav a:hover {
      color: #ffffff;
    }

    /* GALERÍA DE LA MADRUGÁ */

    .salas {
      width: 94%;
      max-width: 1500px;
      margin: 0 auto 60px;

      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 35px;
    }

    .sala {
      display: block;
      width: 100%;
      text-decoration: none;
      color: #ffffff;

      background: #050505;
      border: 1px solid #c9a35b;

      padding: 8px;

      overflow: hidden;
    }

    .sala img {
      display: block;
      width: 100%;
      height: 460px;

      object-fit: contain;
      object-position: center;

      background: #050505;
    }

    .sala h2 {
      margin: 0;
      padding: 20px 10px 22px;

      text-align: center;

      color: #c9a35b;
      font-size: 25px;
      font-weight: normal;
    }

    .sala:hover h2 {
      color: #ffffff;
    }

    /* BOTÓN DE MÚSICA */

    .musica {
      position: fixed;
      bottom: 20px;
      right: 20px;

      z-index: 20;

      background: #111111;
      color: #c9a35b;

      border: 1px solid #c9a35b;

      padding: 8px 13px;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;

      opacity: 0.85;
    }

    /* YOUTUBE OCULTO */

    .youtube {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* MÓVIL */

    @media (max-width: 800px) {

      h1 {
        font-size: 32px;
      }

      .salas {
        width: 94%;
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .sala img {
        height: auto;
        max-height: 520px;
      }

    }

  </style>

</head>
