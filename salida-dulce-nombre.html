<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: #ffffff;
  font-family: Georgia, "Times New Roman", serif;
}

header {
  text-align: center;
  padding: 55px 20px 35px;
}

header h1 {
  margin: 0;
  color: #c9a35b;
  font-size: 42px;
  font-weight: normal;
}

header p {
  color: #ddd;
  font-size: 18px;
  margin-top: 12px;
}

.menu {
  text-align: center;
  margin: 10px 0 40px;
}

.menu a {
  color: #c9a35b;
  text-decoration: none;
  margin: 0 12px;
  font-size: 17px;
}

.menu a:hover {
  color: white;
}

.galeria {
  width: 94%;
  max-width: 1500px;
  margin: auto;
  padding-bottom: 60px;
}

.foto {
  background: #050505;
  border: 1px solid #c9a35b;
  padding: 8px;
  margin-bottom: 35px;
  text-align: center;
}

.foto img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: contain;
  background: #000000;
}

footer {
  text-align: center;
  padding: 30px;
  border-top: 1px solid #333;
  color: #888;
}


/* MUSICA */

.musica {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 100;
}

.musica button {
  background: rgba(0,0,0,0.72);
  border: 1px solid #c9a35b;
  color: #c9a35b;
  padding: 10px 16px;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 14px;
  cursor: pointer;
  border-radius: 2px;
}

.musica button:hover {
  background: #c9a35b;
  color: #080808;
}

.youtube {
  position: fixed;
  width: 1px;
  height: 1px;
  left: -100px;
  top: -100px;
  opacity: 0;
  pointer-events: none;
}


/* MOVIL */

@media (max-width: 800px) {

  header h1 {
    font-size: 32px;
  }

  .menu a {
    display: inline-block;
    margin: 6px 8px;
  }

  .galeria {
    width: 96%;
  }

}

</style>
